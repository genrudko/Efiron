name: build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302

      - name: Restore
        run: dotnet restore Efiron.sln

      - name: Build core
        run: dotnet build src/Efiron.Core/Efiron.Core.csproj -c Release --no-restore

      - name: Test
        run: dotnet test tests/Efiron.Core.Tests/Efiron.Core.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=core-tests.trx"

      - name: Build Windows application
        run: dotnet build src/Efiron.App/Efiron.App.csproj -c Release -r win-x64 --self-contained true --no-restore
