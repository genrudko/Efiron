name: build

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: Core build and tests
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302

      - name: Restore core and tests
        run: dotnet restore tests/Efiron.Core.Tests/Efiron.Core.Tests.csproj

      - name: Build core
        run: dotnet build src/Efiron.Core/Efiron.Core.csproj -c Release --no-restore

      - name: Test
        id: core_tests
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet test tests/Efiron.Core.Tests/Efiron.Core.Tests.csproj `
            -c Release `
            --no-restore `
            --logger "trx;LogFileName=core-tests.trx" `
            --verbosity normal *> core-test.log
          exit $LASTEXITCODE

      - name: Upload Core test diagnostics
        if: steps.core_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: core-test-diagnostics
          path: |
            core-test.log
            tests/Efiron.Core.Tests/TestResults/core-tests.trx
          if-no-files-found: error
          retention-days: 7

      - name: Enforce Core test result
        if: steps.core_tests.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Error "Core tests failed. See core-test-diagnostics."
          exit 1

  windows-app:
    name: Windows application build
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302

      - name: Restore Windows application
        run: dotnet restore src/Efiron.App/Efiron.App.csproj -r win-x64

      - name: Build Windows application
        id: windows_build
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet build src/Efiron.App/Efiron.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            --verbosity minimal *> windows-build.log
          exit $LASTEXITCODE

      - name: Remove unsupported locale resources
        if: steps.windows_build.outcome == 'success'
        shell: pwsh
        run: |
          $output = "src/Efiron.App/bin/Release/net10.0-windows10.0.22000.0/win-x64"
          $allowed = [System.Collections.Generic.HashSet[string]]::new(
            [System.StringComparer]::OrdinalIgnoreCase)
          [void]$allowed.Add("en-US")
          [void]$allowed.Add("ru-RU")

          Get-ChildItem -LiteralPath $output -Directory | ForEach-Object {
            try {
              [void][System.Globalization.CultureInfo]::GetCultureInfo($_.Name)
            }
            catch [System.Globalization.CultureNotFoundException] {
              return
            }

            if (-not $allowed.Contains($_.Name)) {
              Remove-Item -LiteralPath $_.FullName -Recurse -Force
            }
          }

          $remainingLocales = @(
            Get-ChildItem -LiteralPath $output -Directory | Where-Object {
              try {
                [void][System.Globalization.CultureInfo]::GetCultureInfo($_.Name)
                $true
              }
              catch [System.Globalization.CultureNotFoundException] {
                $false
              }
            } | Select-Object -ExpandProperty Name
          )

          $unexpected = @(
            $remainingLocales | Where-Object { -not $allowed.Contains($_) }
          )

          if ($unexpected.Count -gt 0) {
            throw "Unexpected locale directories remain: $($unexpected -join ', ')"
          }

          Write-Host "Retained locale directories: $($remainingLocales -join ', ')"

      - name: Smoke test application startup
        if: steps.windows_build.outcome == 'success'
        id: startup_smoke
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $output = "src/Efiron.App/bin/Release/net10.0-windows10.0.22000.0/win-x64"
          $executable = Join-Path $output "Efiron.exe"
          $process = $null

          try {
            $process = Start-Process `
              -FilePath $executable `
              -WorkingDirectory $output `
              -PassThru

            Start-Sleep -Seconds 8
            $process.Refresh()

            if ($process.HasExited) {
              throw "Efiron exited during startup smoke test with code $($process.ExitCode)."
            }

            "Efiron remained running for the startup smoke interval." |
              Set-Content -LiteralPath startup-smoke.log -Encoding utf8
          }
          catch {
            $_ | Out-String |
              Set-Content -LiteralPath startup-smoke.log -Encoding utf8
            throw
          }
          finally {
            if ($null -ne $process) {
              $process.Refresh()
              if (-not $process.HasExited) {
                Stop-Process -Id $process.Id -Force
              }
            }
          }

      - name: Upload startup smoke diagnostics
        if: steps.startup_smoke.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: windows-startup-diagnostics
          path: startup-smoke.log
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows build diagnostics
        if: steps.windows_build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-diagnostics
          path: windows-build.log
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows prototype
        if: steps.windows_build.outcome == 'success' && steps.startup_smoke.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: efiron-win-x64
          path: src/Efiron.App/bin/Release/net10.0-windows10.0.22000.0/win-x64/
          if-no-files-found: error
          retention-days: 7

      - name: Enforce Windows build result
        if: steps.windows_build.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Error "Windows application build failed. See windows-build-diagnostics."
          exit 1

      - name: Enforce startup smoke result
        if: steps.startup_smoke.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Error "Windows application exited during startup. See windows-startup-diagnostics."
          exit 1
