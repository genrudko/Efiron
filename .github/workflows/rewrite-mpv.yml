name: rewrite mpv

on:
  pull_request:
  push:
    branches:
      - rewrite/001-greenfield-desktop

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mpv-legacy-control:
    name: Isolated legacy libmpv source control
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302

      - name: Restore and build isolated mpv probe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet restore tools/Efiron.MpvProbe/Efiron.MpvProbe.csproj
          dotnet build tools/Efiron.MpvProbe/Efiron.MpvProbe.csproj -c Release --no-restore

      - name: Prepare deterministic H264 fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $fixture = Join-Path $env:RUNNER_TEMP "efiron-mpv-legacy-fixture"
          Remove-Item $fixture -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $fixture -Force | Out-Null
          $fixtureBase64 = Get-Content `
            "tests/fixtures/fullscreen-21x9-h264.mp4.b64" -Raw
          $videoPath = Join-Path $fixture "probe.mp4"
          [IO.File]::WriteAllBytes(
            $videoPath,
            [Convert]::FromBase64String($fixtureBase64.Trim()))
          if ((Get-Item $videoPath).Length -lt 2500) {
            throw "Legacy mpv H264 fixture is invalid."
          }

      - name: Verify retained libmpv source adapter independently
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $fixture = Join-Path $env:RUNNER_TEMP "efiron-mpv-legacy-fixture"
          $evidence = Join-Path $env:RUNNER_TEMP "mpv-legacy-runtime.json"
          $output = "tools/Efiron.MpvProbe/bin/Release/net10.0-windows10.0.22000.0/win-x64"
          $nativeDlls = @(
            Get-ChildItem $output -Recurse -File |
              Where-Object { $_.Name -match '(?i)mpv.*\.dll$|libmpv.*\.dll$' }
          )
          if ($nativeDlls.Count -eq 0) {
            throw "The isolated legacy probe contains no native libmpv DLL."
          }

          New-Item -ItemType Directory -Path mpv-legacy-artifacts -Force | Out-Null
          $python = (Get-Command python -ErrorAction Stop).Source
          $server = Start-Process $python -ArgumentList @(
            "-m","http.server","18771","--bind","127.0.0.1","--directory",$fixture) `
            -WindowStyle Hidden -PassThru
          try {
            Start-Sleep -Seconds 2
            if ($server.HasExited) { throw "Legacy mpv fixture server exited." }
            dotnet run `
              --project tools/Efiron.MpvProbe/Efiron.MpvProbe.csproj `
              -c Release `
              --no-build `
              -- `
              "http://127.0.0.1:18771/probe.mp4" `
              $evidence

            if (-not (Test-Path $evidence)) {
              throw "Legacy mpv runtime evidence was not written."
            }
            $result = Get-Content $evidence -Raw | ConvertFrom-Json
            if ($result.Backend -ne "Mpv" -or
                $result.State -ne "Playing" -or
                -not [bool]$result.SwapChainAvailable -or
                [string]::IsNullOrWhiteSpace([string]$result.Version) -or
                [string]::IsNullOrWhiteSpace([string]$result.VideoCodec)) {
              throw "Legacy mpv source adapter evidence is incomplete: $($result | ConvertTo-Json -Compress)"
            }

            Copy-Item $evidence mpv-legacy-artifacts/ -Force
            [ordered]@{
              HeadSha = "${{ github.event.pull_request.head.sha || github.sha }}"
              Scope = "isolated legacy source adapter; not exposed or packaged by Repair K"
              NativeDllCount = $nativeDlls.Count
              NativeDllNames = @($nativeDlls | ForEach-Object Name)
              Backend = [string]$result.Backend
              State = [string]$result.State
              SwapChainAvailable = [bool]$result.SwapChainAvailable
              Version = [string]$result.Version
              VideoCodec = [string]$result.VideoCodec
            } | ConvertTo-Json -Depth 4 |
              Set-Content mpv-legacy-artifacts/mpv-legacy-summary.json -Encoding utf8
          }
          finally {
            if ($server -and -not $server.HasExited) {
              Stop-Process -Id $server.Id -Force
            }
          }

      - name: Upload isolated legacy mpv evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rewrite-mpv-legacy-evidence
          path: mpv-legacy-artifacts/
          if-no-files-found: error
          retention-days: 14
