name: rewrite candidate

on:
  pull_request:
  push:
    branches:
      - rewrite/001-greenfield-desktop

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  candidate:
    name: Exact-head poster-aligned Windows candidate
    runs-on: windows-latest
    timeout-minutes: 28

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302

      - name: Restore, build and test exact head
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet restore Efiron.Greenfield.sln
          dotnet restore tests/Efiron.Core.Tests/Efiron.Core.Tests.csproj
          dotnet build Efiron.Greenfield.sln -c Release --no-restore
          dotnet test tests/Efiron.Architecture.Tests/Efiron.Architecture.Tests.csproj -c Release --no-build
          dotnet test tests/Efiron.Application.Tests/Efiron.Application.Tests.csproj -c Release --no-build
          dotnet test tests/Efiron.Infrastructure.Tests/Efiron.Infrastructure.Tests.csproj -c Release --no-build
          dotnet test tests/Efiron.Core.Tests/Efiron.Core.Tests.csproj -c Release --no-restore

      - name: Prepare deterministic candidate fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $fixture = Join-Path $env:RUNNER_TEMP "efiron-candidate-fixture"
          $localAppData = [Environment]::GetFolderPath(
            [Environment+SpecialFolder]::LocalApplicationData)
          $data = Join-Path $localAppData "Efiron"
          Remove-Item $fixture,$data -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $fixture,$data -Force | Out-Null

          # Auto now resolves to mpv, so the visual candidate gate must use a
          # real video stream. An audio-only WAV can transiently report Playing
          # without ever creating the WinUI composition swapchain.
          $fixtureBase64 = Get-Content `
            "tests/fixtures/fullscreen-21x9-h264.mp4.b64" -Raw
          $video = Join-Path $fixture "candidate.mp4"
          [IO.File]::WriteAllBytes(
            $video,
            [Convert]::FromBase64String($fixtureBase64.Trim()))
          if ((Get-Item $video).Length -lt 2500) {
            throw "The candidate H264 fixture was not decoded."
          }

          @'
          #EXTM3U
          #EXTINF:-1 tvg-id="candidate.news" group-title="News",Candidate News
          #EXTVLCOPT:input-repeat=-1
          http://127.0.0.1:18766/candidate.mp4
          #EXTINF:-1 tvg-id="candidate.cinema" group-title="Cinema",Candidate Cinema
          #EXTVLCOPT:input-repeat=-1
          http://127.0.0.1:18766/candidate.mp4
          '@ | Set-Content (Join-Path $fixture "playlist.m3u") -Encoding utf8

          $now = [DateTimeOffset]::UtcNow
          $start = $now.AddMinutes(-20).ToString("yyyyMMddHHmmss +0000")
          $middle = $now.AddMinutes(40).ToString("yyyyMMddHHmmss +0000")
          $stop = $now.AddMinutes(100).ToString("yyyyMMddHHmmss +0000")
          @"
          <tv>
            <channel id="candidate.news"><display-name>Candidate News</display-name></channel>
            <channel id="candidate.cinema"><display-name>Candidate Cinema</display-name></channel>
            <programme channel="candidate.news" start="$start" stop="$middle"><title>News Now</title><desc>Current news programme description.</desc></programme>
            <programme channel="candidate.news" start="$middle" stop="$stop"><title>News Next</title><desc>Next news programme description.</desc></programme>
            <programme channel="candidate.cinema" start="$start" stop="$middle"><title>Movie Now</title><desc>Current movie description.</desc></programme>
            <programme channel="candidate.cinema" start="$middle" stop="$stop"><title>Movie Next</title><desc>Next movie description.</desc></programme>
          </tv>
          "@ | Set-Content (Join-Path $fixture "guide.xml") -Encoding utf8

          @{
            playlist = @{ location = (Join-Path $fixture "playlist.m3u"); isEnabled = $true }
            programmeGuide = @{ location = (Join-Path $fixture "guide.xml"); isEnabled = $true }
          } | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $data "sources.json") -Encoding utf8
          @{ version = 1; theme = 2; accent = 1 } |
            ConvertTo-Json | Set-Content (Join-Path $data "appearance.json") -Encoding utf8

      - name: Validate poster-aligned candidate runtime
        id: runtime
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $output = "src/Efiron.Desktop/bin/x64/Release/net10.0-windows10.0.22000.0/win-x64"
          $exe = Join-Path $output "Efiron.exe"
          if (-not (Test-Path $exe)) { throw "Efiron.exe not found: $exe" }

          $fixture = Join-Path $env:RUNNER_TEMP "efiron-candidate-fixture"
          $localAppData = [Environment]::GetFolderPath(
            [Environment+SpecialFolder]::LocalApplicationData)
          $diagnostics = Join-Path $localAppData "Efiron/diagnostics"
          $appearancePath = Join-Path $diagnostics "appearance-runtime.json"
          $layoutPath = Join-Path $diagnostics "layout-runtime.json"
          $playingPath = Join-Path $diagnostics "playback-playing.json"
          $playbackPath = Join-Path $diagnostics "playback-current.json"
          $controlsPath = Join-Path $diagnostics "playback-controls.json"
          $previewPath = Join-Path $diagnostics "poster-preview.png"
          $previewErrorPath = Join-Path $diagnostics "poster-preview-error.log"
          $crashPath = Join-Path $diagnostics "startup-crash.log"
          $process = $null
          $server = $null

          try {
            $python = (Get-Command python -ErrorAction Stop).Source
            $server = Start-Process $python -ArgumentList @(
              "-m","http.server","18766","--bind","127.0.0.1","--directory",$fixture) `
              -WindowStyle Hidden -PassThru
            Start-Sleep -Seconds 2
            if ($server.HasExited) { throw "Candidate media server exited." }

            $env:EFIRON_CI_PLAYBACK_SEQUENCE = "1"
            $env:EFIRON_CI_PLAYBACK_VERIFICATION = "1"
            $env:EFIRON_CI_LAYOUT_VERIFICATION = "1"
            $env:EFIRON_CI_APPEARANCE_VERIFICATION = "1"
            $env:EFIRON_CI_PRESENTATION_CAPTURE = "1"
            $process = Start-Process $exe -WorkingDirectory $output -PassThru

            $deadline = [DateTime]::UtcNow.AddSeconds(75)
            while ([DateTime]::UtcNow -lt $deadline -and
                   (-not (Test-Path $appearancePath) -or
                    -not (Test-Path $layoutPath) -or
                    -not (Test-Path $playingPath) -or
                    -not (Test-Path $playbackPath) -or
                    -not (Test-Path $controlsPath) -or
                    -not (Test-Path $previewPath))) {
              Start-Sleep -Milliseconds 400
              if ($process.HasExited) {
                $crash = if (Test-Path $crashPath) { Get-Content $crashPath -Raw } else { "no crash log" }
                throw "Efiron exited before candidate evidence. $crash"
              }
            }

            if (Test-Path $previewErrorPath) {
              throw "Rendered preview capture failed: $(Get-Content $previewErrorPath -Raw)"
            }
            foreach ($required in @($appearancePath,$layoutPath,$playingPath,$playbackPath,$controlsPath,$previewPath)) {
              if (-not (Test-Path $required)) { throw "Missing candidate evidence: $required" }
            }

            $appearance = Get-Content $appearancePath -Raw | ConvertFrom-Json
            if ($appearance.StoredTheme -ne "Dark" -or
                $appearance.RequestedTheme -ne "Dark" -or
                $appearance.ActualTheme -ne "Dark" -or
                $appearance.Accent -ne "Violet" -or
                [string]::IsNullOrWhiteSpace([string]$appearance.AccentColor)) {
              throw "Unexpected appearance evidence."
            }

            $layout = Get-Content $layoutPath -Raw | ConvertFrom-Json
            $names = @($layout.Layouts | ForEach-Object Layout)
            foreach ($name in @("Wide","Medium","Compact")) {
              if ($name -notin $names) { throw "Layout evidence does not contain $name." }
            }
            $wide = $layout.Layouts | Where-Object Layout -eq "Wide" | Select-Object -First 1
            $medium = $layout.Layouts | Where-Object Layout -eq "Medium" | Select-Object -First 1
            $compact = $layout.Layouts | Where-Object Layout -eq "Compact" | Select-Object -First 1
            if ($wide.CategoryColumn -ne 0 -or
                $wide.ChannelColumn -ne 1 -or $wide.ChannelRow -ne 0 -or
                $wide.PlayerColumn -ne 2 -or $wide.PlayerRow -ne 0 -or
                [bool]$wide.ProgrammeStacked -or
                -not [bool]$wide.CategoryRailVisible) {
              throw "Wide poster layout evidence is invalid."
            }
            if ($medium.CategoryColumn -ne 0 -or
                $medium.ChannelColumn -ne 1 -or $medium.ChannelRow -ne 0 -or
                $medium.PlayerColumn -ne 2 -or $medium.PlayerRow -ne 0 -or
                -not [bool]$medium.ProgrammeStacked -or
                -not [bool]$medium.CategoryRailVisible) {
              throw "Medium poster layout evidence is invalid."
            }
            if ($compact.ChannelColumn -ne 0 -or $compact.ChannelRow -ne 0 -or
                $compact.PlayerColumn -ne 1 -or $compact.PlayerRow -ne 0 -or
                -not [bool]$compact.ProgrammeStacked -or
                [bool]$compact.CategoryRailVisible) {
              throw "Compact poster layout evidence is invalid."
            }

            $playing = Get-Content $playingPath -Raw | ConvertFrom-Json
            if ($playing.State -ne "Playing" -or [string]::IsNullOrWhiteSpace($playing.Source)) {
              throw "Playback did not reach Playing."
            }

            $playback = Get-Content $playbackPath -Raw | ConvertFrom-Json
            if ($playback.BackendId -ne "Mpv" -or
                $playback.SelectedProfile -ne "Auto" -or
                $playback.PlaybackState -ne "Playing" -or
                [int]$playback.VideoWidth -le 0 -or
                [int]$playback.VideoHeight -le 0 -or
                $playback.VideoRenderer -ne "gpu-next") {
              throw "Candidate did not expose a ready mpv video surface: $($playback | ConvertTo-Json -Compress)"
            }

            $controls = Get-Content $controlsPath -Raw | ConvertFrom-Json
            $playbackStateInvalid =
              -not [bool]$controls.Paused -or
              -not [bool]$controls.Resumed -or
              -not [bool]$controls.VolumeSetTo37 -or
              -not [bool]$controls.Muted -or
              -not [bool]$controls.Unmuted -or
              -not [bool]$controls.Stopped -or
              -not [bool]$controls.SwitchedToSecondChannel
            if ($playbackStateInvalid) {
              throw "Playback control evidence is incomplete."
            }
            if ([string]::IsNullOrWhiteSpace([string]$controls.Error) -eq $false) {
              throw "Playback control evidence contains an error: $($controls.Error)"
            }

            Add-Type -AssemblyName System.Drawing
            $preview = Get-Item $previewPath
            if ($preview.Length -lt 10000) { throw "Rendered preview is unexpectedly small." }
            $image = [System.Drawing.Image]::FromFile($previewPath)
            try {
              if ($image.Width -lt 800 -or $image.Height -lt 500) {
                throw "Rendered preview dimensions are too small: $($image.Width)x$($image.Height)."
              }
            }
            finally { $image.Dispose() }

            Start-Sleep -Seconds 3
            $process.Refresh()
            if ($process.HasExited) { throw "Efiron exited after candidate evidence." }
            New-Item -ItemType File -Path (Join-Path $diagnostics "candidate-runtime-ok.marker") -Force | Out-Null
          }
          finally {
            Remove-Item Env:EFIRON_CI_PLAYBACK_SEQUENCE -ErrorAction SilentlyContinue
            Remove-Item Env:EFIRON_CI_PLAYBACK_VERIFICATION -ErrorAction SilentlyContinue
            Remove-Item Env:EFIRON_CI_LAYOUT_VERIFICATION -ErrorAction SilentlyContinue
            Remove-Item Env:EFIRON_CI_APPEARANCE_VERIFICATION -ErrorAction SilentlyContinue
            Remove-Item Env:EFIRON_CI_PRESENTATION_CAPTURE -ErrorAction SilentlyContinue
            if ($process -and -not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            if ($server -and -not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }

      - name: Prepare internal candidate package
        if: steps.runtime.outcome == 'success'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $source = "src/Efiron.Desktop/bin/x64/Release/net10.0-windows10.0.22000.0/win-x64"
          $stage = "candidate-package"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item $source $stage -Recurse

          # Remove only satellite locale directories, never native runtime folders.
          $allowedLocales = @("en-us", "ru-ru")
          Get-ChildItem $stage -Directory -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -match '^[A-Za-z]{2,3}(?:-[A-Za-z0-9]{2,8})+$' -and
              $_.Name.ToLowerInvariant() -notin $allowedLocales
            } |
            Remove-Item -Recurse -Force

          $requiredPackageEntries = @(
            "Efiron.exe",
            "libmpv-2.dll",
            "libvlc/win-x64/libvlc.dll",
            "libvlc/win-x64/libvlccore.dll",
            "libvlc/win-x64/plugins",
            "en-US",
            "ru-RU"
          )
          foreach ($entry in $requiredPackageEntries) {
            if (-not (Test-Path (Join-Path $stage $entry))) {
              throw "Candidate package is missing required entry: $entry"
            }
          }

          $pluginCount = @(
            Get-ChildItem (Join-Path $stage "libvlc/win-x64/plugins") -Recurse -File
          ).Count
          if ($pluginCount -le 0) {
            throw "Candidate package contains no LibVLC plugins."
          }

          $efironExeCount = @(
            Get-ChildItem $stage -Recurse -File -Filter "Efiron.exe"
          ).Count
          if ($efironExeCount -ne 1) {
            throw "Expected exactly one Efiron.exe, got $efironExeCount."
          }
          $libMpvCount = @(
            Get-ChildItem $stage -Recurse -File -Filter "libmpv-2.dll"
          ).Count
          if ($libMpvCount -ne 1) {
            throw "Expected exactly one libmpv-2.dll, got $libMpvCount."
          }

          @{
            product = "Efiron"
            platform = "Windows 11 x64"
            architecture = "greenfield"
            presentation = "poster-aligned rewrite"
            status = "internal visual review candidate"
            headSha = "${{ github.event.pull_request.head.sha || github.sha }}"
            validationRefSha = "${{ github.sha }}"
            runId = "${{ github.run_id }}"
            packageChecks = @{
              efironExeCount = $efironExeCount
              libMpvCount = $libMpvCount
              libVlcPluginCount = $pluginCount
              nativeLibVlc = $true
              locales = @("en-US", "ru-RU")
            }
            builtAtUtc = [DateTimeOffset]::UtcNow.ToString("O")
          } | ConvertTo-Json -Depth 4 | Set-Content "$stage/candidate-manifest.json" -Encoding utf8

      - name: Upload candidate diagnostics
        if: steps.runtime.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: rewrite-candidate-diagnostics
          if-no-files-found: ignore
          path: ~/AppData/Local/Efiron/diagnostics/

      - name: Upload rendered poster preview
        if: steps.runtime.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: efiron-poster-preview
          path: ~/AppData/Local/Efiron/diagnostics/poster-preview.png
          if-no-files-found: error

      - name: Upload internal poster-aligned Windows candidate
        if: steps.runtime.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: efiron-poster-aligned-win-x64
          path: candidate-package/
          if-no-files-found: error

      - name: Enforce candidate runtime
        if: steps.runtime.outcome != 'success'
        shell: pwsh
        run: |
          throw "Poster-aligned candidate runtime validation failed."
