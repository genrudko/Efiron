name: rewrite fullscreen

on:
  pull_request:
  push:
    branches:
      - rewrite/001-greenfield-desktop

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fullscreen:
    name: Real-video fullscreen fill and edges
    runs-on: windows-latest
    timeout-minutes: 24

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302

      - name: Restore and build exact head
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet restore Efiron.Greenfield.sln
          dotnet build Efiron.Greenfield.sln -c Release --no-restore

      - name: Prepare ultrawide MJPEG fullscreen fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $fixture = Join-Path $env:RUNNER_TEMP "efiron-fullscreen-fixture"
          $localAppData = [Environment]::GetFolderPath(
            [Environment+SpecialFolder]::LocalApplicationData)
          $data = Join-Path $localAppData "Efiron"
          Remove-Item $fixture,$data -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $fixture,$data -Force | Out-Null

          Add-Type -AssemblyName System.Drawing
          $width = 1680
          $height = 720
          $framesPerSecond = 10
          $frameCount = 300
          $bitmap = [System.Drawing.Bitmap]::new($width,$height)
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $jpegStream = [IO.MemoryStream]::new()
          try {
            $graphics.Clear([System.Drawing.Color]::FromArgb(52,101,164))
            $red = [System.Drawing.SolidBrush]::new(
              [System.Drawing.Color]::FromArgb(224,49,49))
            $green = [System.Drawing.SolidBrush]::new(
              [System.Drawing.Color]::FromArgb(18,184,134))
            $white = [System.Drawing.SolidBrush]::new(
              [System.Drawing.Color]::White)
            try {
              $graphics.FillRectangle($red,0,0,$width,110)
              $graphics.FillRectangle($green,0,$height-110,$width,110)
              $font = [System.Drawing.Font]::new("Arial",48,[System.Drawing.FontStyle]::Bold)
              try {
                $graphics.DrawString("EFIRON FULLSCREEN VIDEO",$font,$white,470,315)
              }
              finally { $font.Dispose() }
            }
            finally {
              $red.Dispose()
              $green.Dispose()
              $white.Dispose()
            }
            $bitmap.Save($jpegStream,[System.Drawing.Imaging.ImageFormat]::Jpeg)
          }
          finally {
            $graphics.Dispose()
            $bitmap.Dispose()
          }
          $jpeg = $jpegStream.ToArray()
          $jpegStream.Dispose()
          if ($jpeg.Length -lt 10000) { throw "MJPEG frame is unexpectedly small." }

          function Write-FourCc([IO.BinaryWriter]$Writer,[string]$Value) {
            $Writer.Write([Text.Encoding]::ASCII.GetBytes($Value))
          }
          function Start-Chunk([IO.BinaryWriter]$Writer,[string]$FourCc) {
            Write-FourCc $Writer $FourCc
            $position = $Writer.BaseStream.Position
            $Writer.Write([uint32]0)
            return $position
          }
          function End-Chunk([IO.BinaryWriter]$Writer,[long]$SizePosition) {
            $end = $Writer.BaseStream.Position
            $size = [uint32]($end - $SizePosition - 4)
            $Writer.BaseStream.Position = $SizePosition
            $Writer.Write($size)
            $Writer.BaseStream.Position = $end
            if (($size % 2) -ne 0) { $Writer.Write([byte]0) }
          }
          function Start-List([IO.BinaryWriter]$Writer,[string]$Type) {
            $position = Start-Chunk $Writer "LIST"
            Write-FourCc $Writer $Type
            return $position
          }

          $videoPath = Join-Path $fixture "channel.avi"
          $file = [IO.File]::Create($videoPath)
          $writer = [IO.BinaryWriter]::new($file)
          try {
            $riff = Start-Chunk $writer "RIFF"
            Write-FourCc $writer "AVI "

            $hdrl = Start-List $writer "hdrl"
            $avih = Start-Chunk $writer "avih"
            $writer.Write([uint32](1000000 / $framesPerSecond))
            $writer.Write([uint32]($jpeg.Length * $framesPerSecond))
            $writer.Write([uint32]0)
            $writer.Write([uint32]0x10)
            $writer.Write([uint32]$frameCount)
            $writer.Write([uint32]0)
            $writer.Write([uint32]1)
            $writer.Write([uint32]$jpeg.Length)
            $writer.Write([uint32]$width)
            $writer.Write([uint32]$height)
            1..4 | ForEach-Object { $writer.Write([uint32]0) }
            End-Chunk $writer $avih

            $strl = Start-List $writer "strl"
            $strh = Start-Chunk $writer "strh"
            Write-FourCc $writer "vids"
            Write-FourCc $writer "MJPG"
            $writer.Write([uint32]0)
            $writer.Write([uint16]0)
            $writer.Write([uint16]0)
            $writer.Write([uint32]0)
            $writer.Write([uint32]1)
            $writer.Write([uint32]$framesPerSecond)
            $writer.Write([uint32]0)
            $writer.Write([uint32]$frameCount)
            $writer.Write([uint32]$jpeg.Length)
            $writer.Write([uint32]0xFFFFFFFF)
            $writer.Write([uint32]0)
            $writer.Write([int16]0)
            $writer.Write([int16]0)
            $writer.Write([int16]$width)
            $writer.Write([int16]$height)
            End-Chunk $writer $strh

            $strf = Start-Chunk $writer "strf"
            $writer.Write([uint32]40)
            $writer.Write([int32]$width)
            $writer.Write([int32]$height)
            $writer.Write([uint16]1)
            $writer.Write([uint16]24)
            $writer.Write([uint32][BitConverter]::ToUInt32(
              [Text.Encoding]::ASCII.GetBytes("MJPG"),0))
            $writer.Write([uint32]$jpeg.Length)
            $writer.Write([int32]0)
            $writer.Write([int32]0)
            $writer.Write([uint32]0)
            $writer.Write([uint32]0)
            End-Chunk $writer $strf
            End-Chunk $writer $strl
            End-Chunk $writer $hdrl

            $movi = Start-List $writer "movi"
            $moviFourCcPosition = $movi + 4
            $indexEntries = [Collections.Generic.List[object]]::new()
            for ($frame = 0; $frame -lt $frameCount; $frame++) {
              $chunkStart = $writer.BaseStream.Position
              $chunk = Start-Chunk $writer "00dc"
              $writer.Write($jpeg)
              End-Chunk $writer $chunk
              $indexEntries.Add([pscustomobject]@{
                Offset = [uint32]($chunkStart - $moviFourCcPosition)
                Size = [uint32]$jpeg.Length
              })
            }
            End-Chunk $writer $movi

            $idx1 = Start-Chunk $writer "idx1"
            foreach ($entry in $indexEntries) {
              Write-FourCc $writer "00dc"
              $writer.Write([uint32]0x10)
              $writer.Write([uint32]$entry.Offset)
              $writer.Write([uint32]$entry.Size)
            }
            End-Chunk $writer $idx1
            End-Chunk $writer $riff
          }
          finally {
            $writer.Dispose()
            $file.Dispose()
          }
          if (-not (Test-Path $videoPath) -or (Get-Item $videoPath).Length -lt 1000000) {
            throw "MJPEG fullscreen fixture was not created."
          }

          @'
          #EXTM3U
          #EXTINF:-1 tvg-id="fullscreen.one" group-title="Fullscreen",Fullscreen One
          http://127.0.0.1:18770/channel.avi
          '@ | Set-Content (Join-Path $fixture "playlist.m3u") -Encoding utf8

          $now = [DateTimeOffset]::UtcNow
          $start = $now.AddMinutes(-30).ToString("yyyyMMddHHmmss +0000")
          $stop = $now.AddMinutes(90).ToString("yyyyMMddHHmmss +0000")
          @"
          <tv>
            <channel id="fullscreen.one"><display-name>Fullscreen One</display-name></channel>
            <programme channel="fullscreen.one" start="$start" stop="$stop"><title>Fullscreen programme</title></programme>
          </tv>
          "@ | Set-Content (Join-Path $fixture "guide.xml") -Encoding utf8

          @{
            playlist = @{ location = (Join-Path $fixture "playlist.m3u"); isEnabled = $true }
            programmeGuide = @{ location = (Join-Path $fixture "guide.xml"); isEnabled = $true }
          } | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $data "sources.json") -Encoding utf8
          @{ version = 1; theme = 1; accent = 0 } |
            ConvertTo-Json | Set-Content (Join-Path $data "appearance.json") -Encoding utf8

      - name: Verify real-video fullscreen fill and edge pixels
        shell: pwsh
        env:
          EFIRON_CI_FULLSCREEN_VERIFICATION: "1"
        run: |
          $ErrorActionPreference = "Stop"
          $output = "src/Efiron.Desktop/bin/x64/Release/net10.0-windows10.0.22000.0/win-x64"
          $exe = Join-Path $output "Efiron.exe"
          if (-not (Test-Path $exe)) { throw "Efiron.exe not found: $exe" }

          $fixture = Join-Path $env:RUNNER_TEMP "efiron-fullscreen-fixture"
          $localAppData = [Environment]::GetFolderPath(
            [Environment+SpecialFolder]::LocalApplicationData)
          $diagnostics = Join-Path $localAppData "Efiron/diagnostics"
          $evidencePath = Join-Path $diagnostics "fullscreen-runtime.json"
          $previewPath = Join-Path $diagnostics "fullscreen-preview.png"
          $errorPath = Join-Path $diagnostics "fullscreen-preview-error.log"
          $crashPath = Join-Path $diagnostics "startup-crash.log"
          $process = $null
          $server = $null
          New-Item -ItemType Directory -Path fullscreen-artifacts -Force | Out-Null

          try {
            $python = (Get-Command python -ErrorAction Stop).Source
            $server = Start-Process $python -ArgumentList @(
              "-m","http.server","18770","--bind","127.0.0.1","--directory",$fixture) `
              -WindowStyle Hidden -PassThru
            Start-Sleep -Seconds 2
            if ($server.HasExited) { throw "Fullscreen media server exited." }

            $process = Start-Process $exe -WorkingDirectory $output -PassThru
            $deadline = [DateTime]::UtcNow.AddSeconds(100)
            while ([DateTime]::UtcNow -lt $deadline -and
                   (-not (Test-Path $evidencePath) -or -not (Test-Path $previewPath))) {
              Start-Sleep -Milliseconds 300
              $process.Refresh()
              if ($process.HasExited) {
                $crash = if (Test-Path $crashPath) { Get-Content $crashPath -Raw } else { "no crash log" }
                throw "Efiron exited before fullscreen evidence. $crash"
              }
            }

            if (Test-Path $errorPath) {
              throw "Fullscreen capture failed: $(Get-Content $errorPath -Raw)"
            }
            if (-not (Test-Path $evidencePath) -or -not (Test-Path $previewPath)) {
              throw "Fullscreen evidence is incomplete."
            }

            $evidence = Get-Content $evidencePath -Raw | ConvertFrom-Json
            if ($evidence.PresenterKind -ne "FullScreen") {
              throw "Unexpected presenter: $($evidence.PresenterKind)"
            }
            if ([double]$evidence.TitleBarRowHeight -ne 0 -or
                [double]$evidence.NavigationColumnWidth -ne 0) {
              throw "Shell chrome remains visible in fullscreen."
            }
            if (-not [bool]$evidence.Surface.IsFullscreen -or
                [double]$evidence.Surface.LiveRootRowSpacing -ne 0 -or
                [double]$evidence.Surface.PlayerWorkspaceRowSpacing -ne 0 -or
                [double]$evidence.Surface.PlayerBorderThickness -ne 0) {
              throw "Fullscreen surface geometry is invalid."
            }
            if ($evidence.Surface.PlaybackState -ne "Playing" -or
                [string]::IsNullOrWhiteSpace([string]$evidence.Surface.PlaybackSource)) {
              throw "Fullscreen fixture was not playing when evidence was recorded."
            }
            if ([string]::IsNullOrWhiteSpace([string]$evidence.Surface.VideoCropGeometry)) {
              throw "Fullscreen video fill crop geometry was not applied."
            }
            if ($evidence.WindowBackground -ne "#FF000000" -or
                $evidence.Surface.LiveRootBackground -ne "#FF000000") {
              throw "Fullscreen root surfaces are not black."
            }
            if ([double]$evidence.TopWhitePixelRatio -gt 0.01 -or
                [double]$evidence.BottomWhitePixelRatio -gt 0.01) {
              throw "White fullscreen edge detected: top=$($evidence.TopWhitePixelRatio), bottom=$($evidence.BottomWhitePixelRatio)"
            }

            Start-Sleep -Seconds 2
            Add-Type -AssemblyName System.Drawing
            Add-Type -AssemblyName System.Windows.Forms
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $desktopPath = Join-Path $diagnostics "fullscreen-desktop.png"
            $desktopEvidencePath = Join-Path $diagnostics "fullscreen-desktop-runtime.json"
            $bitmap = [System.Drawing.Bitmap]::new(
              $bounds.Width,
              $bounds.Height,
              [System.Drawing.Imaging.PixelFormat]::Format24bppRgb)
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            try {
              $graphics.CopyFromScreen(
                $bounds.Location,
                [System.Drawing.Point]::Empty,
                $bounds.Size)
              $bitmap.Save($desktopPath, [System.Drawing.Imaging.ImageFormat]::Png)

              function Measure-NonBlackRatio(
                [System.Drawing.Bitmap]$Image,
                [int]$YStart,
                [int]$YEnd) {
                $xStart = [int]($Image.Width * 0.20)
                $xEnd = [int]($Image.Width * 0.80)
                $nonBlack = 0L
                $samples = 0L
                for ($y = $YStart; $y -lt $YEnd; $y += 2) {
                  for ($x = $xStart; $x -lt $xEnd; $x += 2) {
                    $pixel = $Image.GetPixel($x, $y)
                    if ($pixel.R -gt 30 -or $pixel.G -gt 30 -or $pixel.B -gt 30) {
                      $nonBlack++
                    }
                    $samples++
                  }
                }
                if ($samples -eq 0) { return 0d }
                return [double]$nonBlack / [double]$samples
              }

              $topContentRatio = Measure-NonBlackRatio `
                $bitmap `
                ([int]($bitmap.Height * 0.04)) `
                ([int]($bitmap.Height * 0.16))
              $lowerContentRatio = Measure-NonBlackRatio `
                $bitmap `
                ([int]($bitmap.Height * 0.62)) `
                ([int]($bitmap.Height * 0.74))
              if ($topContentRatio -lt 0.70 -or $lowerContentRatio -lt 0.70) {
                throw "Decoded video did not fill fullscreen: top=$topContentRatio lower=$lowerContentRatio"
              }

              $desktopEvidence = [ordered]@{
                HeadSha = "${{ github.event.pull_request.head.sha || github.sha }}"
                Width = $bitmap.Width
                Height = $bitmap.Height
                TopContentRatio = $topContentRatio
                LowerContentRatio = $lowerContentRatio
                PlaybackState = [string]$evidence.Surface.PlaybackState
                CropGeometry = [string]$evidence.Surface.VideoCropGeometry
              }
              $desktopEvidence | ConvertTo-Json |
                Set-Content $desktopEvidencePath -Encoding utf8
            }
            finally {
              $graphics.Dispose()
              $bitmap.Dispose()
            }

            $image = [System.Drawing.Image]::FromFile($previewPath)
            try {
              if ($image.Width -lt 800 -or $image.Height -lt 500) {
                throw "Fullscreen preview dimensions are too small: $($image.Width)x$($image.Height)."
              }
            }
            finally { $image.Dispose() }

            $artifactFiles = @(
              $evidencePath,
              $previewPath,
              $desktopPath,
              $desktopEvidencePath)
            Copy-Item -Path $artifactFiles -Destination fullscreen-artifacts/ -Force
            Get-Content $evidencePath -Raw
          }
          finally {
            Get-ChildItem $diagnostics -Filter "fullscreen-*" -File -ErrorAction SilentlyContinue |
              Copy-Item -Destination fullscreen-artifacts/ -Force -ErrorAction SilentlyContinue
            if ($process -and -not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            if ($server -and -not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }

      - name: Upload fullscreen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rewrite-fullscreen-evidence
          path: fullscreen-artifacts/
          if-no-files-found: error
          retention-days: 14
