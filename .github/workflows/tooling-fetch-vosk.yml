name: tooling-fetch-vosk

on:
  push:
    branches:
      - live/002-channel-library
    paths:
      - .github/workflows/tooling-fetch-vosk.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p payload/libs

          curl --fail --location --retry 4 \
            --output payload/vosk-model-small-ru-0.22.zip \
            https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip

          cat > pom.xml <<'POM'
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>local.tooling</groupId>
            <artifactId>vosk-offline</artifactId>
            <version>1.0.0</version>
            <dependencies>
              <dependency>
                <groupId>com.alphacephei</groupId>
                <artifactId>vosk</artifactId>
                <version>0.3.45</version>
              </dependency>
            </dependencies>
          </project>
          POM

          mvn --batch-mode --quiet dependency:copy-dependencies \
            -DoutputDirectory="$GITHUB_WORKSPACE/payload/libs" \
            -DincludeScope=runtime

          sha256sum payload/vosk-model-small-ru-0.22.zip > payload/SHA256SUMS.txt
          find payload/libs -maxdepth 1 -type f -printf '%f\n' | sort > payload/LIBS.txt

      - name: Upload offline ASR payload
        uses: actions/upload-artifact@v4
        with:
          name: local-asr-vosk
          path: payload
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
