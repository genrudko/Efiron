name: rewrite mpv host candidate

on:
  pull_request:
  push:
    branches:
      - rewrite/001-greenfield-desktop

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-host-candidate:
    name: Exact-head native mpv host Windows candidate
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302

      - name: Restore and build exact head
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet restore Efiron.Greenfield.sln
          dotnet build Efiron.Greenfield.sln -c Release --no-restore

      - name: Prepare verified and cleaned native-host candidate package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $source = "src/Efiron.Desktop/bin/x64/Release/net10.0-windows10.0.22000.0/win-x64"
          $stage = "native-host-candidate-package"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue

          $requiredSourceEntries = @(
            "Efiron.exe",
            "mpv-host/mpv.exe",
            "mpv-host/runtime-manifest.json",
            "mpv-host/NOTICE.txt",
            "libmpv-2.dll",
            "libvlc/win-x64/libvlc.dll",
            "libvlc/win-x64/libvlccore.dll",
            "libvlc/win-x64/plugins",
            "en-US",
            "ru-RU"
          )
          foreach ($entry in $requiredSourceEntries) {
            if (-not (Test-Path (Join-Path $source $entry))) {
              throw "Desktop output is missing required native-host entry: $entry"
            }
          }

          $sourceFiles = @(Get-ChildItem $source -Recurse -File)
          $sourceBytes = ($sourceFiles | Measure-Object Length -Sum).Sum
          Copy-Item $source $stage -Recurse

          # VideoLAN.LibVLC.Windows is copied once for the executable and once
          # below the referenced Efiron.Playback project. Runtime lookup uses
          # the root libvlc directory, so the nested tree is a byte-identical
          # packaging duplicate and must never reach a user candidate.
          $duplicateLibVlc = Join-Path $stage "Efiron.Playback/libvlc"
          if (Test-Path $duplicateLibVlc) {
            Remove-Item $duplicateLibVlc -Recurse -Force
          }
          $playbackOutputDirectory = Join-Path $stage "Efiron.Playback"
          if ((Test-Path $playbackOutputDirectory) -and
              @(Get-ChildItem $playbackOutputDirectory -Force).Count -eq 0) {
            Remove-Item $playbackOutputDirectory -Force
          }

          # Windows App SDK language payloads are *.mui, while some dependency
          # satellites are *.resources.dll. Remove a top-level directory only
          # when every file below it is a localization payload. This content-
          # based rule cannot mistake mpv-host or any product directory for a
          # locale merely because its name contains a hyphen.
          $allowedLocales = @("en-us", "ru-ru")
          Get-ChildItem $stage -Directory -ErrorAction SilentlyContinue |
            ForEach-Object {
              $directory = $_
              $files = @(Get-ChildItem $directory.FullName -Recurse -File -ErrorAction SilentlyContinue)
              if ($files.Count -gt 0) {
                $localizedFiles = @($files | Where-Object {
                  $_.Extension -ieq ".mui" -or
                  $_.Name.EndsWith(
                    ".resources.dll",
                    [StringComparison]::OrdinalIgnoreCase)
                })
                if ($directory.Name.ToLowerInvariant() -notin $allowedLocales -and
                    $localizedFiles.Count -eq $files.Count) {
                  Remove-Item $directory.FullName -Recurse -Force
                }
              }
            }

          # Symbols and native import libraries are build-time artifacts, not
          # runtime dependencies of the portable user candidate.
          Get-ChildItem $stage -Recurse -File -Filter "*.pdb" -ErrorAction SilentlyContinue |
            Remove-Item -Force
          Get-ChildItem (Join-Path $stage "libvlc/win-x64") -File -Filter "*.lib" -ErrorAction SilentlyContinue |
            Remove-Item -Force

          $requiredPackageEntries = @(
            "Efiron.exe",
            "mpv-host/mpv.exe",
            "mpv-host/runtime-manifest.json",
            "mpv-host/NOTICE.txt",
            "libmpv-2.dll",
            "libvlc/win-x64/libvlc.dll",
            "libvlc/win-x64/libvlccore.dll",
            "libvlc/win-x64/plugins",
            "en-US",
            "ru-RU"
          )
          foreach ($entry in $requiredPackageEntries) {
            if (-not (Test-Path (Join-Path $stage $entry))) {
              throw "Native-host candidate package is missing required entry: $entry"
            }
          }

          if (Test-Path $duplicateLibVlc) {
            throw "Clean candidate still contains nested duplicate Efiron.Playback/libvlc."
          }

          $remainingLocaleDirectories = @(Get-ChildItem $stage -Directory |
            Where-Object {
              $directory = $_
              $files = @(Get-ChildItem $directory.FullName -Recurse -File -ErrorAction SilentlyContinue)
              if ($files.Count -eq 0) { return $false }
              $localizedFiles = @($files | Where-Object {
                $_.Extension -ieq ".mui" -or
                $_.Name.EndsWith(
                  ".resources.dll",
                  [StringComparison]::OrdinalIgnoreCase)
              })
              return $localizedFiles.Count -eq $files.Count
            })
          $unexpectedLocales = @($remainingLocaleDirectories |
            Where-Object { $_.Name.ToLowerInvariant() -notin $allowedLocales })
          if ($unexpectedLocales.Count -gt 0) {
            throw "Unexpected packaged locale directories: $($unexpectedLocales.Name -join ', ')."
          }

          $mpvExe = Join-Path $stage "mpv-host/mpv.exe"
          $mpvManifestPath = Join-Path $stage "mpv-host/runtime-manifest.json"
          $mpvManifest = Get-Content $mpvManifestPath -Raw | ConvertFrom-Json
          $mpvHash = (Get-FileHash $mpvExe -Algorithm SHA256).Hash.ToLowerInvariant()
          $mpvLength = (Get-Item $mpvExe).Length
          if ($mpvHash -ne [string]$mpvManifest.exeSha256) {
            throw "Packaged mpv.exe SHA-256 does not match its runtime manifest."
          }
          if ($mpvLength -ne [long]$mpvManifest.executableLength) {
            throw "Packaged mpv.exe length does not match its runtime manifest."
          }

          $mpvExeCount = @(Get-ChildItem $stage -Recurse -File -Filter "mpv.exe").Count
          if ($mpvExeCount -ne 1) {
            throw "Expected exactly one packaged mpv.exe, got $mpvExeCount."
          }
          $efironExeCount = @(Get-ChildItem $stage -Recurse -File -Filter "Efiron.exe").Count
          if ($efironExeCount -ne 1) {
            throw "Expected exactly one packaged Efiron.exe, got $efironExeCount."
          }
          $libVlcDllCount = @(Get-ChildItem $stage -Recurse -File -Filter "libvlc.dll").Count
          if ($libVlcDllCount -ne 1) {
            throw "Expected exactly one packaged LibVLC runtime, got $libVlcDllCount copies."
          }
          $pdbCount = @(Get-ChildItem $stage -Recurse -File -Filter "*.pdb").Count
          if ($pdbCount -ne 0) {
            throw "Clean candidate still contains $pdbCount PDB files."
          }
          $importLibraryCount = @(Get-ChildItem $stage -Recurse -File -Filter "*.lib").Count
          if ($importLibraryCount -ne 0) {
            throw "Clean candidate still contains $importLibraryCount native import libraries."
          }
          $pluginCount = @(
            Get-ChildItem (Join-Path $stage "libvlc/win-x64/plugins") -Recurse -File
          ).Count
          if ($pluginCount -le 0) {
            throw "Native-host candidate contains no LibVLC fallback plugins."
          }

          $packageFiles = @(Get-ChildItem $stage -Recurse -File)
          $packageBytes = ($packageFiles | Measure-Object Length -Sum).Sum
          if ($packageFiles.Count -ge 900) {
            throw "Candidate cleanup regressed: expected fewer than 900 files, got $($packageFiles.Count)."
          }
          if ($packageBytes -ge 600MB) {
            throw "Candidate cleanup regressed: expected less than 600 MiB unpacked, got $packageBytes bytes."
          }

          [ordered]@{
            product = "Efiron"
            platform = "Windows 11 x64"
            architecture = "greenfield"
            repair = "Repair J.1 native-window host, theme and package sanitation"
            status = "physical playback validation candidate"
            headSha = "${{ github.event.pull_request.head.sha || github.sha }}"
            validationRefSha = "${{ github.sha }}"
            runId = "${{ github.run_id }}"
            playbackHost = [ordered]@{
              backend = "MpvHost"
              presentation = "out-of-process native D3D11 window"
              executable = "mpv-host/mpv.exe"
              buildId = [string]$mpvManifest.buildId
              version = [string]$mpvManifest.version
              sha256 = $mpvHash
              length = $mpvLength
              deterministicProcessBoundary = $true
            }
            packageChecks = [ordered]@{
              sourceFileCount = $sourceFiles.Count
              sourceBytes = $sourceBytes
              packagedFileCount = $packageFiles.Count
              packagedBytes = $packageBytes
              efironExeCount = $efironExeCount
              mpvExeCount = $mpvExeCount
              libVlcRuntimeCount = $libVlcDllCount
              duplicatePlaybackLibVlcPresent = $false
              pdbCount = $pdbCount
              importLibraryCount = $importLibraryCount
              libVlcPluginCount = $pluginCount
              locales = @("en-US", "ru-RU")
            }
            builtAtUtc = [DateTimeOffset]::UtcNow.ToString("O")
          } | ConvertTo-Json -Depth 6 |
            Set-Content "$stage/native-host-candidate-manifest.json" -Encoding utf8

          Write-Host "Candidate sanitation: $($sourceFiles.Count) -> $($packageFiles.Count) files; $sourceBytes -> $packageBytes bytes."

      - name: Upload native-host Windows candidate
        uses: actions/upload-artifact@v4
        with:
          name: efiron-repair-j1-native-host-win-x64
          path: native-host-candidate-package/
          if-no-files-found: error
          retention-days: 90
